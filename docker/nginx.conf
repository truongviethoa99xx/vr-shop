server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router is client-side, so any unknown path must fall back to
  # index.html. Without this, loading or refreshing /showroom-3d returns 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a rebuild keeps serving stale bundles.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
